<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Lakers</title>

        <link rel="preconnect" href ="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@600&display=swap">
        
        <link rel="stylesheet" href="./styles/reset.css"/>
        <link rel="stylesheet" href="./styles/tokens.css"/>
        <link rel="stylesheet" href="./styles/page.css" />

        <script type="importmap">
            {
                "imports" : {
                    "@unbndl/html" : "https://unpkg.com/@unbndl/html"
                }
            }
        </script>

        <script type="module">
            import { define } from "@unbndl/html";
            import { LakersCardElement } from "./src/lakers-card.js";
            import { LakersElement } from "./src/lakers-element.js";

            define({
                "lakers-card": LakersCardElement,
                "lakers-element" : LakersElement
            });
        </script>


    </head>
    <body>
        <script>
            document.body.addEventListener(
                "dark-mode:toggle",
                (event) => {
                    const page = event.currentTarget;
                    const checked = event.detail.checked;
                    page.classList.toggle("dark-mode", checked);
                }
            );

            function toggleDarkMode(target, checked) {
                const customEvent = new CustomEvent(
                    "dark-mode:toggle", {
                        bubbles: true,
                        detail: { checked },
                    }
                );

                document.body.dispatchEvent(customEvent);
            }
        </script>
        <header class="header">
            <h1>
                <svg class="icon">
                    <use href="/icons/icons.svg#icon-basketball" />
                </svg>
                Los Angeles Lakers
            </h1>

            <label>
                <input type="checkbox" onchange="toggleDarkMode(event.target.checked)" />
                Dark mode
            </label>
        </header>

        <main class="layout">
            <section class="content">
                <lakers-card>
                    <h2 slot="title">Coach</h2>
                    <p slot="content">JJ Redick</p>
                </lakers-card>

                <lakers-card>
                    <h2 slot="title">Conference</h2>
                    <p slot="content">Western Conference</p>
                </lakers-card>

                <!-- BEGIN OF LAKERS CARDS -->


                <lakers-element src="data/data.json">
                </lakers-element>
                
                 <!-- END OF LAKERS CARDS -->
            </section>
        </main>
    </body>
</html>
