<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Lakers</title>

        <link rel="preconnect" href ="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@600&display=swap">
        
        <link rel="stylesheet" href="./styles/reset.css"/>
        <link rel="stylesheet" href="./styles/tokens.css"/>
        <link rel="stylesheet" href="./styles/page.css" />

        <script type="importmap">
            {
                "imports" : {
                    "@unbndl/html" : "https://unpkg.com/@unbndl/html",
                    "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
                    "@unbndl/view": "https://unpkg.com/@unbndl/view"
                }
            }
        </script>

        <script type="module">
            import { define } from "@unbndl/html";
            import { LakersCardElement } from "./src/lakers-card.js";
            import { LakersElement } from "./src/lakers-element.js";
            import { LakersHeaderElement } from "./src/lakers-header.js";
            import { Auth } from "@unbndl/auth";

            define({
                "auth-provider": Auth.Provider,
                "lakers-card": LakersCardElement,
                "lakers-element" : LakersElement,
                "lakers-header": LakersHeaderElement
            });
        </script>
    </head>

    <body>
        <auth-provider>
            <lakers-header></lakers-header>
            <script>
                document.body.addEventListener(
                    "dark-mode:toggle",
                    (event) => {
                        const page = event.currentTarget;
                        const checked = event.detail.checked;
                        page.classList.toggle("dark-mode", checked);
                    }
                );
            </script>

            <main class="layout">
                <section class="content">
                    <lakers-element src="/api/nba/lakers">
                    </lakers-element>
                </section>
            </main>
        </auth-provider>
    </body>
</html>
