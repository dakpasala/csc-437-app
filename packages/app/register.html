<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@600&display=swap">

    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/page.css" />

    <script type="module" src="/src/login.ts"></script>
  </head>
  <body class="page">
    <auth-provider>
        <h2>User Registration</h2>
        <main class="card">
            <login-form api="/auth/register">
            <label>
                <span>Username:</span>
                <input name="username"
                autocomplete="off" />
            </label>
            <label>
                <span>Password:</span>
                <input type="password"
                name="password" />
            </label>
            <span slot="submit-label">Register</span>
            </login-form>
            <p class="login">
            Already signed up? You can
            <a href="./login.html">log in</a> instead.
            </p>
        </main>
    </auth-provider>
  </body>
</html>
